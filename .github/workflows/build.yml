name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Build debug APK
        id: build
        run: ./gradlew clean assembleDebug --stacktrace > build_output.log 2>&1
        continue-on-error: true
      - name: Show summary (always)
        if: always()
        run: |
          echo "===== BUILD RESULT ====="
          tail -n 20 build_output.log
          echo ""
          echo "===== EXTRACTED ERROR LINES ====="
          grep -n -E "error:|Caused by:|FAILED|Exception" build_output.log | head -60 || echo "(brak dopasowan)"
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fireworks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
